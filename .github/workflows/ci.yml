name: CI

on:
  push:
    paths: ['scripts/**', 'templates/**', '.github/workflows/**']
  pull_request:

jobs:
  auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sintaxis del auditor y de las plantillas JS
        run: |
          node --check scripts/audit.mjs
          node --check templates/sitemap-gen.mjs

      - name: vercel.json válido y plantillas presentes
        run: |
          node -e "JSON.parse(require('fs').readFileSync('templates/vercel.json','utf8')); console.log('vercel.json OK')"
          test -f templates/robots.txt -a -f templates/llms.txt -a -f templates/Seo.tsx -a -f templates/NotFound.tsx

      - name: Auditoría de prueba — example.com (markdown)
        run: node scripts/audit.mjs https://example.com

      - name: Auditoría de prueba — example.com (JSON, valida las 20 señales)
        run: |
          node scripts/audit.mjs https://example.com --json > reporte.json
          node -e "
            const r = require('./reporte.json');
            if (!r.findings || r.findings.length !== 20) {
              console.error('Señales esperadas: 20, obtenidas: ' + (r.findings || []).length);
              process.exit(1);
            }
            console.log('OK: ' + r.findings.length + ' señales · fallos=' +
              r.findings.filter(f => f.status === 'fail').length +
              ' · avisos=' + r.findings.filter(f => f.status === 'warn').length);
          "

      - name: Auditoría de prueba — SPA real con sitemap (vite.dev, --limit 4)
        run: node scripts/audit.mjs https://vite.dev --limit 4 --json > /dev/null

      - name: Generación de sitemap de prueba desde las plantillas
        run: |
          node templates/sitemap-gen.mjs --base https://midominio.com /precios
          grep -q '<loc>https://midominio.com/servicios</loc>' public/sitemap.xml